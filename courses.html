<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillUp LMS - Courses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">SkillUp<span>LMS</span></div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="courses.html" class="active">Courses</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
      <a href="login.html" class="btn btn-outline">Login</a>
      <a href="register.html" class="btn btn-primary">Sign Up</a>
    </div>
    <div class="hamburger" id="hamburger">&#9776;</div>
  </header>

  <main class="courses-page">
    <section class="page-banner">
      <h1>Explore Our Courses</h1>
      <div class="course-filters">
        <input type="text" id="course-search" placeholder="Search courses...">
        <select id="category-filter">
          <option value="all">All Categories</option>
          <option value="Web Dev">Web Dev</option>
          <option value="Programming">Programming</option>
          <option value="Design">Design</option>
          <option value="Marketing">Marketing</option>
          <option value="Data Science">Data Science</option>
          <option value="Business">Business</option>
          <option value="Creative">Creative</option>
          <option value="IT & Cloud">IT & Cloud</option>
        </select>
      </div>
    </section>

    <section class="course-grid" id="course-grid">
      <!-- course cards injected here by JS from the COURSES array (120+ courses) -->
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 SkillUp LMS. All rights reserved.</p>
    <div class="footer-links">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="404.html">Test 404</a>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
