<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillUp LMS - Contact</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">SkillUp<span>LMS</span></div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
      <a href="login.html" class="btn btn-outline">Login</a>
      <a href="register.html" class="btn btn-primary">Sign Up</a>
    </div>
    <div class="hamburger" id="hamburger">&#9776;</div>
  </header>

  <main class="contact-page">
    <section class="page-banner">
      <h1>Contact Us</h1>
      <p>Have a question? We'd love to hear from you.</p>
    </section>

    <section class="contact-form-section">
      <form id="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Your message" required></textarea>

        <button type="submit" class="btn btn-primary">Send Message</button>
        <p id="contact-status"></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 SkillUp LMS. All rights reserved.</p>
    <div class="footer-links">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="404.html">Test 404</a>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
