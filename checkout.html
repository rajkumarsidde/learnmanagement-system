<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillUp LMS - Checkout</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">SkillUp<span>LMS</span></div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
      <a href="login.html" class="btn btn-outline">Login</a>
      <a href="register.html" class="btn btn-primary">Sign Up</a>
    </div>
    <div class="hamburger" id="hamburger">&#9776;</div>
  </header>

  <main class="checkout-page">
    <h1>Checkout</h1>
    <section class="checkout-grid">
      <form id="billing-form">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="full-name" required>

        <label for="address">Address</label>
        <input type="text" id="address" name="address" required>

        <label for="city">City</label>
        <input type="text" id="city" name="city" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </form>

      <div class="order-summary">
        <h3>Order Summary</h3>
        <div id="checkout-items"></div>
        <h4>Total: $<span id="checkout-total">0</span></h4>
        <a href="payment.html" class="btn btn-primary btn-large">Continue to Payment</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 SkillUp LMS. All rights reserved.</p>
    <div class="footer-links">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="404.html">Test 404</a>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
