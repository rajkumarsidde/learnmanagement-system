<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkillUp LMS - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">SkillUp<span>LMS</span></div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <div class="nav-actions">
      <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
      <a href="register.html" class="btn btn-primary">Sign Up</a>
    </div>
    <div class="hamburger" id="hamburger">&#9776;</div>
  </header>

  <main class="auth-page">
    <div class="auth-box">
      <h1>Login</h1>
      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Your password" required>

        <button type="submit" class="btn btn-primary btn-large">Login</button>
        <p id="login-status"></p>
      </form>
      <p class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 SkillUp LMS. All rights reserved.</p>
    <div class="footer-links">
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="404.html">Test 404</a>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
